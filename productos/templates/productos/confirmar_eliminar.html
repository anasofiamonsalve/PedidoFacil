{% extends 'base.html' %}
{% block content %}
<div class="card border-danger">
    <div class="card-body">
        <h4>¿Eliminar "{{ producto.nombre }}"?</h4>
        <p>Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'lista_productos' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
