{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-header-rojo">
                <h4 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i>Crear cuenta</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for campo in form %}
                        <div class="mb-3">
                            <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
                            {{ campo }}
                            {% if campo.help_text %}
                                <div class="form-text small">{{ campo.help_text }}</div>
                            {% endif %}
                            {% for error in campo.errors %}
                                <div class="text-danger small">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button class="btn btn-primary w-100">Crear cuenta</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
